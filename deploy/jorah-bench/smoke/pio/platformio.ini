; Jorah's robotics bench: the boards whose toolchains install-robotics-bench.sh fetches, so they
; build offline afterwards. A project builds offline only with these platform versions and boards
; (or others whose packages are already in /opt/jorah-bench/pio/core). Anything else is an Adam
; task: "install X: why, size, source" (docs/runbooks/robotics-bench.md).
;
; platform_packages pins what the platforms leave as ranges, so every package is at least 7 days
; old: framework-arduinoespressif32 ~4.30312.0 would otherwise resolve to a build released the day
; this was written. The install checks each fetched package's release date as well.

[platformio]
default_envs = esp32dev

[env]
framework = arduino

[esp32]
platform = platformio/espressif32@8.0.0
platform_packages =
  platformio/framework-arduinoespressif32@4.30312.261024
  platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
  platformio/toolchain-riscv32-esp@14.2.0+20260121
  platformio/tool-esptool@2.50400.0

; ESP32 (classic), the smoke test's board.
[env:esp32dev]
platform = ${esp32.platform}
board = esp32dev
platform_packages =
  ${esp32.platform_packages}
  platformio/framework-arduinoespressif32-esp32-libs@3.3.12

; ESP32-S3, the XIAO board docs/plan/08-robotics.md uses for the safety supervisor.
[env:xiao_esp32s3]
platform = ${esp32.platform}
board = seeed_xiao_esp32s3
platform_packages =
  ${esp32.platform_packages}
  platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12

; Raspberry Pi RP2040 (Pico), Arduino on mbed.
[env:pico]
platform = platformio/raspberrypi@1.20.0
board = pico
platform_packages =
  platformio/framework-arduino-mbed@4.6.0
