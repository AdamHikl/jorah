pre-commit:
  commands:
    guard:
      run: scripts/guard-staged.sh
    secrets:
      run: gitleaks git . --staged --config .gitleaks.toml --redact --no-banner --log-level warn

pre-push:
  # A script, not a command: lefthook skipped the command form as "no matching push files" (2026-11-07).
  scripts:
    "guard-main.sh":
      runner: bash
      use_stdin: true
