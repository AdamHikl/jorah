[project]
name = "jorah-voice"
version = "0.1.0"
description = "The PC side of talking to Jorah: speech recognition, thinking and speech"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "sherpa-onnx==2.0.1",
  "websockets==17.3",
]

[project.scripts]
jorah-voice = "jorah_voice.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jorah_voice"]
